openapi: 3.0.0
info:
  title: Ponchi API
  version: 1.0.0

servers:
  - url: https://d5dv0tsfdqg45rj2b9i8.4b4k4pg5.apigw.yandexcloud.net

paths:
  /v1/auth/request_code:
    post:
      summary: Request SMS code
      operationId: authRequestCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequestCodeRequest'
            examples:
              signup:
                value:
                  phone: "+79990001122"
                  purpose: signup
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4ec2l72q51ei9949jbi
        service_account_id: ajemnnm1pnie37b0apmr
        payload_format_version: '0.1'
      responses:
        '200':
          description: Code request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestCodeResponse'
              examples:
                ok:
                  value:
                    ok: true
                    retry_after: 60
        '400':
          description: Invalid phone or purpose
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPhone:
                  value:
                    error: INVALID_PHONE
                invalidPurpose:
                  value:
                    error: INVALID_PURPOSE
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooManyRequests:
                  value:
                    error: TOO_MANY_REQUESTS
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: INTERNAL_ERROR

  /v1/auth/verify_code:
    post:
      summary: Verify SMS code and create account
      operationId: authVerifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyCodeRequest'
            examples:
              signup:
                value:
                  phone: "+79990001122"
                  code: "1234"
                  name: "Мария"
                  password: "secret123"
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4eg07lmq3vbmo02u4j7
        service_account_id: ajemnnm1pnie37b0apmr
        payload_format_version: '0.1'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Invalid input, code, or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPhone:
                  value:
                    error: INVALID_PHONE
                invalidCode:
                  value:
                    error: INVALID_CODE
                codeExpired:
                  value:
                    error: CODE_EXPIRED
                weakPassword:
                  value:
                    error: WEAK_PASSWORD
                invalidName:
                  value:
                    error: INVALID_NAME
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userExists:
                  value:
                    error: USER_ALREADY_EXISTS
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: INTERNAL_ERROR

  /v1/auth/login:
    post:
      summary: Login by phone and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              login:
                value:
                  phone: "+79990001122"
                  password: "secret123"
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e3rtqumu63ffe27jpt
        service_account_id: ajemnnm1pnie37b0apmr
        payload_format_version: '0.1'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Invalid phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPhone:
                  value:
                    error: INVALID_PHONE
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    error: INVALID_CREDENTIALS
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: INTERNAL_ERROR

  /v1/auth/reset_password:
    post:
      summary: Reset password by SMS code
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
            examples:
              reset:
                value:
                  phone: "+79990001122"
                  code: "1234"
                  new_password: "newsecret123"
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e25a19dcprhtk3qm06
        service_account_id: ajemnnm1pnie37b0apmr
        payload_format_version: '0.1'
      responses:
        '200':
          description: Password reset success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                ok:
                  value:
                    ok: true
        '400':
          description: Invalid phone, code, expired code, or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPhone:
                  value:
                    error: INVALID_PHONE
                invalidCode:
                  value:
                    error: INVALID_CODE
                codeExpired:
                  value:
                    error: CODE_EXPIRED
                weakPassword:
                  value:
                    error: WEAK_PASSWORD
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: INTERNAL_ERROR

  /v1/me:
    get:
      summary: Get current user by access token
      operationId: getMe
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4em82o4j3p7l40g8bi0
        service_account_id: ajemnnm1pnie37b0apmr
        payload_format_version: '0.1'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    error: INVALID_TOKEN
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: INTERNAL_ERROR

components:
  schemas:
    AuthRequestCodeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - purpose
      properties:
        phone:
          type: string
          pattern: '^\+7\d{10}$'
          example: "+79990001122"
        purpose:
          type: string
          enum:
            - signup
            - reset
          example: signup

    AuthVerifyCodeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - code
        - name
        - password
      properties:
        phone:
          type: string
          pattern: '^\+7\d{10}$'
          example: "+79990001122"
        code:
          type: string
          pattern: '^\d{4}$'
          example: "1234"
        name:
          type: string
          minLength: 1
          example: "Мария"
        password:
          type: string
          minLength: 6
          example: "secret123"

    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          pattern: '^\+7\d{10}$'
          example: "+79990001122"
        password:
          type: string
          minLength: 1
          example: "secret123"

    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - code
        - new_password
      properties:
        phone:
          type: string
          pattern: '^\+7\d{10}$'
          example: "+79990001122"
        code:
          type: string
          pattern: '^\d{4}$'
          example: "1234"
        new_password:
          type: string
          minLength: 6
          example: "newsecret123"

    AuthRequestCodeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - retry_after
      properties:
        ok:
          type: boolean
          example: true
        retry_after:
          type: integer
          example: 60

    AuthSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          example: "a_long_random_token"
        user:
          $ref: '#/components/schemas/User'

    OkResponse:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - phone
        - name
        - bonuses
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "3f824d34-196d-4f4b-b92f-2f96a5385e48"
        phone:
          type: string
          example: "+79990001122"
        name:
          type: string
          example: "Мария"
        bonuses:
          type: integer
          example: 0
        avatar:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-03-25T12:00:00Z"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: INTERNAL_ERROR
